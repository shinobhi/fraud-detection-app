<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fraud Event Analyzer</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <h1>Fraud Event Analyzer</h1>
    <p>A small fraud-triage application that combines deterministic business rules with
      an AI-assisted risk assessment. Paste a JSON event into the browser interface to
      receive a structured risk rating, incident summary, detected signals, and
      recommended follow-up actions.</p>
    <form id="fraud-form">
      <label for="event-json">Fraud event JSON</label>
      <textarea id="event-json" name="event" spellcheck="false" required>{
  "message": "Fraud event received",
  "event": {
    "email": "jsmith+promo17@gmail.com",
    "country": "US",
    "ip_country": "RO",
    "card_country": "US",
    "promo_code": "FREE30",
    "prior_accounts_from_ip": 8,
    "payment_attempts_last_hour": 5
  }
}</textarea>
      <button type="submit">Analyze event</button>
    </form>
    <pre id="result" role="status" aria-live="polite" hidden></pre>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
